name: Build Connector

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      semver:
        required: true
        type: string
      upload_url:
        required: true
        type: string

jobs:
  build-windows:
    name: "Windows (${{ matrix.arch }} ${{ matrix.format }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            format: msi
            artifact_path: connector/src-tauri/target/release/bundle/msi/*.msi
            artifact_name: nexterm-connector-windows-x64.msi
          - arch: x64
            target: x86_64-pc-windows-msvc
            format: exe
            artifact_path: connector/src-tauri/target/release/bundle/nsis/*.exe
            artifact_name: nexterm-connector-windows-x64.exe
          - arch: arm64
            target: aarch64-pc-windows-msvc
            format: exe
            artifact_path: connector/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            artifact_name: nexterm-connector-windows-arm64.exe

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Update connector versions
        shell: bash
        run: |
          VERSION="${{ inputs.semver }}"
          cd connector && npm pkg set version="$VERSION" && cd ..
          cd connector/src-tauri
          jq ".version = \"$VERSION\"" tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install -g yarn
          yarn install

      - name: Build client
        working-directory: client
        run: yarn build

      - name: Install connector dependencies
        working-directory: connector
        run: |
          npm install -g yarn
          yarn install

      - name: Build Connector
        working-directory: connector
        run: yarn tauri build ${{ matrix.arch == 'arm64' && format('--target {0}', matrix.target) || '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find artifact
        id: find_artifact
        shell: bash
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact_path }} 2>/dev/null | head -1)
          echo "artifact_file=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_file }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

  build-macos:
    name: "macOS (${{ matrix.arch }})"
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
            artifact_path: connector/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: nexterm-connector-macos-x64.dmg
          - arch: arm64
            target: aarch64-apple-darwin
            artifact_path: connector/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifact_name: nexterm-connector-macos-arm64.dmg

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Import Apple signing and notarization credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} )); then
            printf '::error::Missing required macOS signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/nexterm-connector-certificate.p12"
          keychain_path="$RUNNER_TEMP/nexterm-connector-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/nexterm-notarization-key.p8"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | openssl base64 -d -A -out "$api_key_path"
          chmod 600 "$api_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' \
            | head -1)"

          if [[ -z "$signing_identity" ]]; then
            echo '::error::The imported certificate does not contain a Developer ID Application identity.'
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Update connector versions
        run: |
          VERSION="${{ inputs.semver }}"
          cd connector && npm pkg set version="$VERSION" && cd ..
          cd connector/src-tauri
          jq ".version = \"$VERSION\"" tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install -g yarn
          yarn install

      - name: Build client
        working-directory: client
        run: yarn build

      - name: Install connector dependencies
        working-directory: connector
        run: |
          npm install -g yarn
          yarn install

      - name: Build Connector
        working-directory: connector
        run: yarn tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}

      - name: Find artifact
        id: find_artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(${{ matrix.artifact_path }})
          if (( ${#artifacts[@]} != 1 )); then
            printf '::error::Expected exactly one DMG, found %d\n' "${#artifacts[@]}"
            exit 1
          fi
          echo "artifact_file=${artifacts[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify macOS signature and notarization
        env:
          APP_BUNDLE_DIR: connector/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          DMG_PATH: ${{ steps.find_artifact.outputs.artifact_file }}
        run: |
          set -euo pipefail

          app_bundle="$(find "$APP_BUNDLE_DIR" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo '::error::Could not find the built macOS application bundle.'
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          spctl --assess --type execute --verbose=4 "$app_bundle"
          hdiutil verify "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type install --verbose=4 "$DMG_PATH"

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_file }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream

      - name: Remove temporary Apple credentials
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/nexterm-connector-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/nexterm-connector-certificate.p12"
          rm -f "$RUNNER_TEMP/nexterm-notarization-key.p8"

  build-linux:
    name: "Linux (${{ matrix.format }})"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            artifact_path: connector/src-tauri/target/release/bundle/deb/*.deb
            artifact_name: nexterm-connector-linux-x64.deb
          - format: rpm
            artifact_path: connector/src-tauri/target/release/bundle/rpm/*.rpm
            artifact_name: nexterm-connector-linux-x64.rpm
          - format: AppImage
            artifact_path: connector/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact_name: nexterm-connector-linux-x64.AppImage

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Update connector versions
        run: |
          VERSION="${{ inputs.semver }}"
          cd connector && npm pkg set version="$VERSION" && cd ..
          cd connector/src-tauri
          jq ".version = \"$VERSION\"" tauri.conf.json > tmp.json && mv tmp.json tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Install client dependencies
        working-directory: client
        run: |
          npm install -g yarn
          yarn install

      - name: Build client
        working-directory: client
        run: yarn build

      - name: Install connector dependencies
        working-directory: connector
        run: |
          npm install -g yarn
          yarn install

      - name: Build Connector
        working-directory: connector
        run: yarn tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Find artifact
        id: find_artifact
        run: |
          ARTIFACT=$(ls ${{ matrix.artifact_path }} 2>/dev/null | head -1)
          echo "artifact_file=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: Upload to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ steps.find_artifact.outputs.artifact_file }}
          asset_name: ${{ matrix.artifact_name }}
          asset_content_type: application/octet-stream
