name: Build Mobile

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      semver:
        required: true
        type: string
      upload_url:
        required: true
        type: string

jobs:
  build-apk:
    name: "APK (${{ matrix.abi }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64, universal]

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Setup Android signing
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ABI_ARG=""
          if [ "${{ matrix.abi }}" != "universal" ]; then ABI_ARG="-Pabi=${{ matrix.abi }}"; fi
          ./gradlew :androidApp:assembleRelease $ABI_ARG \
            -PversionName=${{ inputs.semver }} -PversionCode=${{ github.run_number }}
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "$RUNNER_TEMP/nexterm-${{ inputs.version }}-${{ matrix.abi }}.apk"

      - name: Upload APK to Release
        uses: ./.github/actions/upload-release-asset
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ runner.temp }}/nexterm-${{ inputs.version }}-${{ matrix.abi }}.apk
          asset_name: nexterm-${{ inputs.version }}-${{ matrix.abi }}.apk
          asset_content_type: application/vnd.android.package-archive

  build-ios:
    name: "iOS (Unsigned)"
    runs-on: macos-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Fetch libghostty-vt XCFramework
        working-directory: mobile/shared/native
        run: |
          VT=$(grep -m1 '^VT_VERSION=' build-libghostty.sh | cut -d= -f2)
          BASE="https://release.files.ghostty.org/libghostty-vt/$VT"
          curl -fsSLO "$BASE/SHA256SUMS" && curl -fsSLO "$BASE/ghostty-vt-$VT.xcframework.zip"
          grep "ghostty-vt-$VT.xcframework.zip" SHA256SUMS | shasum -a 256 -c -
          unzip -q "ghostty-vt-$VT.xcframework.zip" && rm -rf "ghostty-vt.xcframework/macos-arm64_x86_64" SHA256SUMS ./*.zip

      - name: Build iOS
        working-directory: mobile/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ inputs.semver }} CURRENT_PROJECT_VERSION=${{ github.run_number }} build

      - name: Create unsigned IPA
        run: |
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/Payload"
          cp -r "$RUNNER_TEMP/build/Build/Products/Release-iphoneos/Nexterm.app" "$WORK_DIR/Payload/"
          (cd "$WORK_DIR" && zip -qr "$RUNNER_TEMP/nexterm-${{ inputs.version }}.ipa" Payload)

      - name: Upload unsigned IPA to Release
        uses: ./.github/actions/upload-release-asset
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: ${{ runner.temp }}/nexterm-${{ inputs.version }}.ipa
          asset_name: nexterm-${{ inputs.version }}.ipa
          asset_content_type: application/octet-stream
