name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      semver: ${{ steps.get_version.outputs.semver }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: Require a version tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        run: |
          echo "Select an existing v* tag when starting this workflow."
          exit 1

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SEMVER=$(echo "$VERSION" | sed 's/-.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f name="Release $VERSION" \
            -F draft=true \
            -F prerelease=false \
            --jq '"id=\(.id)", "upload_url=\(.upload_url)"' >> "$GITHUB_OUTPUT"

  build-cli:
    name: "Build CLI"
    needs: create-release
    uses: ./.github/workflows/build-cli.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-mobile:
    name: "Build Mobile"
    needs: create-release
    uses: ./.github/workflows/build-mobile.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-server:
    name: "Build Server"
    needs: create-release
    uses: ./.github/workflows/build-server.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-engine:
    name: "Build Engine"
    needs: create-release
    uses: ./.github/workflows/build-engine.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-connector:
    name: "Build Connector"
    needs: create-release
    uses: ./.github/workflows/build-connector.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      upload_url: ${{ needs.create-release.outputs.upload_url }}
    secrets: inherit

  build-docker:
    name: "Build Docker"
    needs: create-release
    uses: ./.github/workflows/build-docker.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
    secrets: inherit

  finalize-release:
    name: "Finalize Release"
    needs: [create-release, build-cli, build-mobile, build-server, build-engine, build-connector, build-docker]
    uses: ./.github/workflows/finalize-release.yml
    with:
      version: ${{ needs.create-release.outputs.version }}
      semver: ${{ needs.create-release.outputs.semver }}
      release_id: ${{ needs.create-release.outputs.release_id }}
    secrets: inherit


  cleanup-on-failure:
    name: "Cleanup on Failure"
    runs-on: ubuntu-latest
    needs: [create-release, build-cli, build-mobile, build-server, build-engine, build-connector, build-docker]
    if: failure()
    steps:
      - name: Delete release
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release_id }}
              });
              console.log('Release deleted');
            } catch (e) {
              console.log('Failed to delete release:', e.message);
            }

      - name: Delete tag
        uses: actions/github-script@v9
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${process.env.TAG}`
              });
              console.log('Tag deleted');
            } catch (e) {
              console.log('Failed to delete tag:', e.message);
            }
