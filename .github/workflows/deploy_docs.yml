name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'server/routes/**', 'server/validations/**', 'server/middlewares/permission.js', 'server/utils/route.js', 'server/openapi.js']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install yarn
        run: npm install -g yarn
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: yarn install
      - name: Install flatc
        run: |
          curl -sSL -o /tmp/flatc.zip https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip
          sudo unzip -o /tmp/flatc.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
      - name: Generate schema
        run: yarn schema:generate
      - name: Build with VitePress
        run: yarn run docs:build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5