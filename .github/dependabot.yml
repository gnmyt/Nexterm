version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/client'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'npm'
    directory: '/connector'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directory: '/landing'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'cargo'
    directories:
      - '/cli'
      - '/connector/src-tauri'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'gradle'
    directory: '/mobile'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'alpine'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
